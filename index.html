<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valley City Detective Simulator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1 id="game-title">Valley City Detective Simulator</h1>
      <nav>
        <button id="btn-new-game">Novo Jogo</button>
        <select id="language-select">
          <option value="pt-BR">Português</option>
          <option value="en-US">English</option>
          <option value="es-ES">Español</option>
        </select>
      </nav>
    </header>
    <main>
      <section id="scene-container"></section>
      <aside id="sidebar">
        <div id="inventory">
          <h2 id="inventory-title">Inventário</h2>
          <ul id="inventory-list"></ul>
        </div>
        <div id="notes">
          <h2 id="notes-title">Notas</h2>
          <ul id="notes-list"></ul>
        </div>
      </aside>
    </main>
    <div id="dialogue-container" class="hidden">
      <div id="dialogue-text"></div>
      <div id="dialogue-options"></div>
    </div>
  </div>
  <!-- Main entry point -->
  <script type="module" src="./main.js"></script>
</body>
</html>
